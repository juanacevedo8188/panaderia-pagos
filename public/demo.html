<!doctype html>
<html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avenida — Vista previa</title>
<link rel="icon" type="image/png" href="/logo-avenida.png?v=1">
<link rel="apple-touch-icon" href="/logo-avenida.png?v=1"><style>
*{box-sizing:border-box}body{margin:0;background:#e9ecf4;color:#353d68;font:13px system-ui,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 20px;background:#fff;border-bottom:1px solid #dce0eb}header b{font-size:15px}header small{display:block;color:#727785;margin-top:3px}.controles{display:flex;gap:6px}button,a{font:inherit;border:1px solid #dce0eb;background:#fff;border-radius:7px;padding:8px 12px;cursor:pointer;text-decoration:none;color:inherit}button[aria-pressed=true]{background:#353d68;color:#fff;border-color:#353d68}main{padding:14px}iframe{display:block;border:1px solid #dce0eb;border-radius:12px;background:#f5f6fa;width:100%;height:calc(100dvh - 108px);margin:auto;box-shadow:0 10px 30px #25433112}iframe.movil{width:min(var(--ancho-movil,390px),100%)}select{font:inherit;padding:7px;border:1px solid #dce0eb;border-radius:7px;background:white;color:#353d68;min-width:0}@media(max-width:550px){header{padding:10px 12px}header small{font-size:10px}.controles{width:100%}.controles>*{flex:1;text-align:center;font-size:11px;padding:7px}iframe{height:calc(100dvh - 138px)}main{padding:8px}}
</style></head><body><header><div><b>Avenida · Tu nueva administración</b><small>Vista de prueba con datos ficticios. No modifica la planilla real.</small></div><div class="controles"><button id="escritorio" aria-pressed="true">Computadora</button><button id="movil" aria-pressed="false">Celular</button><select id="ancho-movil" aria-label="Ancho del celular"><option value="390">390 px</option><option value="320">320 px</option><option value="360">360 px</option><option value="430">430 px</option></select><a href="/?demo=1" target="_blank" rel="noopener">Abrir completa ↗</a></div></header><main><iframe id="app" src="/?demo=1" title="Demostración de Avenida"></iframe></main><script>
const app=document.getElementById('app');
document.getElementById('ancho-movil').addEventListener('change',e=>{app.style.setProperty('--ancho-movil',e.target.value+'px');document.getElementById('movil').click();});
for(const id of ['escritorio','movil'])document.getElementById(id).addEventListener('click',()=>{app.classList.toggle('movil',id==='movil');for(const n of ['escritorio','movil'])document.getElementById(n).setAttribute('aria-pressed',String(n===id));});
</script></body></html>
