<!doctype html>
<html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avenida — Vista previa</title><style>
*{box-sizing:border-box}body{margin:0;background:#e7ebe3;color:#21483d;font:13px system-ui,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 20px;background:#fff;border-bottom:1px solid #d6ded1}header b{font-size:15px}header small{display:block;color:#687465;margin-top:3px}.controles{display:flex;gap:6px}button,a{font:inherit;border:1px solid #d4dfcf;background:#fff;border-radius:7px;padding:8px 12px;cursor:pointer;text-decoration:none;color:inherit}button[aria-pressed=true]{background:#225c4e;color:#fff;border-color:#225c4e}main{padding:14px}iframe{display:block;border:1px solid #d2d9cc;border-radius:12px;background:#f6f5ef;width:100%;height:calc(100dvh - 108px);margin:auto;box-shadow:0 10px 30px #25433112}iframe.movil{width:min(390px,100%)}@media(max-width:550px){header{padding:10px 12px}header small{font-size:10px}.controles{width:100%}.controles>*{flex:1;text-align:center;font-size:11px;padding:7px}iframe{height:calc(100dvh - 138px)}main{padding:8px}}
</style></head><body><header><div><b>Avenida · Tu nueva administración</b><small>Vista de prueba con datos ficticios. No modifica la planilla real.</small></div><div class="controles"><button id="escritorio" aria-pressed="true">Computadora</button><button id="movil" aria-pressed="false">Celular</button><a href="/?demo=1" target="_blank" rel="noopener">Abrir completa ↗</a></div></header><main><iframe id="app" src="/?demo=1" title="Demostración de Avenida"></iframe></main><script>
